# layout.toml

[layout]
mode = "master" # scrolling | dwindle | master
gap = 2
extent_presets = [0.25, 0.375, 0.5, 0.625, 0.75, 1.0]

[layout.struts]
left = 2
right = 2
top = 4
bottom = 2

[layout.scrolling]
center_underfull_strip = true
default_extent_fraction = 0.5

[layout.master]
position = "left"
default_width_fraction = 0.75

[overview]
zoom = 0.5
background_blur = true
workspace_wallpaper = false
shortcuts = true
shortcut_keys = "1234567890"

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

[workspaces]
empty_above = true
