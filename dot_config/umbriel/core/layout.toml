# layout.toml

[layout]
mode = "dwindle" # scrolling | dwindle | master | floating
gap = 2
extent_presets = [0.25, 0.375, 0.5, 0.625, 0.75, 1.0]

[layout.struts]
left = 2
right = 2
top = 2
bottom = 2

[layout.master]
position = "left"
default_width_fraction = 0.75

[layout.scrolling]
center_underfull_strip = true
default_extent_fraction = 0.5

[layout.stacking]
drop_zones = true

[overview]
zoom = 0.5
background_blur = true
workspace_wallpaper = false
shortcuts = true
shortcut_keys = "1234567890"

[workspaces]
empty_above = true
