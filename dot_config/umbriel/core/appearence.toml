# appearance.toml

[appearance]
prefer_no_csd = true
border_width = 2               # 0-100
outer_border_width = 4         # 0-100
corner_radius = 6

[colors]
shadow = "#000000FF"

[colors.overview]
workspace_background = "#00000000"

[appearance.shadow]
enabled = true
softness = 30
offset_x = 0
offset_y = 0

[appearance.blur]
enabled = false
optimized = false # false to no xray
passes = 1       # 0-8
radius = 2       # 0-100
noise = 0.02     # 0.0-1.0
brightness = 1.0 # 0.0-2.0
contrast = 1.0   # 0.0-2.0
saturation = 1.1 # 0.0-2.0
