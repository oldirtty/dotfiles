# appearance.toml

[appearance]
prefer_no_csd = true
border_width = 3               # 0-100
outer_border_width = 3         # 0-100
corner_radius = 8

[appearance.blur]
enabled = true
optimized = true # false to no xray
passes = 4       # 0-8
radius = 5       # 0-100
noise = 0.02     # 0.0-1.0
brightness = 1.0 # 0.0-2.0
contrast = 1.0   # 0.0-2.0
saturation = 1.1 # 0.0-2.0
