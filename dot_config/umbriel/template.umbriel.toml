# noctalia/colors.toml

[colors]
background = "{{colors.surface_container.default.hex}}F0"
text_primary = "{{colors.on_surface.default.hex}}FF"
text_muted = "{{colors.on_surface_variant.default.hex}}FF"
accent_primary = "{{colors.primary.default.hex}}FF"
accent_secondary = "{{colors.secondary.default.hex}}FF"
warning = "{{colors.terminal_normal_yellow.default.hex}}FF"
error = "{{colors.error.default.hex}}FF"
insert_hint = "{{colors.primary.default.hex}}80"
backdrop = "{{colors.surface_variant.default.hex}}FF"
shadow = "{{colors.background.default.hex}}FF"

[colors.border]
focused = "{{colors.primary.default.hex}}FF"
unfocused = "{{colors.outline.default.hex}}FF"
outer = "{{colors.surface.default.hex}}FF"

[colors.overview]
background_tint = "{{colors.surface.default.hex}}CC"
badge = "{{colors.primary.default.hex}}80"

[colors.title_bar]
background = "{{colors.surface.default.hex}}FF"
background_unfocused = "{{colors.surface_container.default.hex}}FF"
text = "{{colors.on_surface.default.hex}}FF"
text_unfocused = "{{colors.on_surface_variant.default.hex}}FF"
close = "{{colors.terminal_bright_red.default.hex}}FF"
maximize = "{{colors.terminal_bright_green.default.hex}}FF"
minimize = "{{colors.terminal_bright_yellow.default.hex}}FF"

[[window_rule]]
match.is_focused = false
border_color_unfocused = "{{colors.surface.default.hex}}FF"
border_color_outer = "{{colors.outline.default.hex}}FF"

[[window_rule]]
match.is_scratchpad = true
border_color_focused = "{{colors.secondary.default.hex}}FF"
border_color_unfocused = "{{colors.surface.default.hex}}FF"
