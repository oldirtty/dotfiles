# noctalia/colors.toml

[colors]
background = "{{colors.surface_container.default.hex}}F0"
text_primary = "{{colors.on_surface.default.hex}}FF"
text_muted = "{{colors.on_surface_variant.default.hex}}FF"
accent_primary = "{{colors.primary.default.hex}}FF"
accent_secondary = "{{colors.secondary.default.hex}}FF"
warning = "{{colors.terminal_normal_yellow.default.hex}}FF"
error = "{{colors.error.default.hex}}FF"
insert_hint = "{{colors.primary.default.hex}}80"
backdrop = "{{colors.surface_variant.default.hex}}FF"

[colors.border]
focused = "{{colors.primary.default.hex}}FF"
unfocused = "{{colors.surface_variant.default.hex}}FF"
scratchpad_focused = "{{colors.secondary.default.hex}}FF"
scratchpad_unfocused = "{{colors.secondary_container.default.hex}}FF"
outer = "{{colors.surface.default.hex}}FF"

[colors.overview]
background_tint = "{{colors.surface.default.hex}}CC"
workspace_background = "{{colors.surface.default.hex}}80" # 30%
badge = "{{colors.primary.default.hex}}80"
