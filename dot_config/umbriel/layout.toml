# layout.toml

[layout]
mode = "scrolling" # scrolling | dwindle | master
gap = 6
width_presets = [0.25, 0.375, 0.5, 0.625, 0.75, 1.0]

[layout.struts]
left = 0
right = 0
top = 0
bottom = 0

[layout.scrolling]
expand_single_column = true
center_underfull_strip = true
default_width_fraction = 0.5

[overview]
zoom = 0.5
background_blur = false
shortcuts = true
shortcut_keys = "1234567890"

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

[workspaces]
empty_above = true
