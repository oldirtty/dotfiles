# machines/nostromo.toml

[general]
autostart = [
    "noctalia",
    "sleep 5; filen-desktop",
    "easyeffects --hide-window",
    "flatpak run rocks.spotifast.Spotifast",
]

[input.keyboard]
layout  = "us"
variant = "altgr-intl"   # XKB variant
options = "compose:menu" # XKB options, comma-separated

[output."LG Electronics LG ULTRAGEAR 511AZGFGA247"]
focus_at_startup = true
mode = "2560x1440@165"
position = [0, 335]
scale = 1.0
vrr = "fullscreen"
hdr = "fullscreen"
sdr_white = 203
tearing = false
min_workspaces = 4

[output."Samsung Electric Company LF24T35 HX5W300850"]
mode = "1920x1080@75"
position = [2560, 0]
scale = 1.0
transform = "270"
enabled = true
layout.scrolling.default_extent_fraction = 1
min_workspaces = 4

[[window_rule]]
match.app_id = "(s|S)potifast$"
default_output = "Samsung Electric Company LF24T35 HX5W300850"
