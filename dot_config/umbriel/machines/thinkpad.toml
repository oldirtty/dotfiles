# machines/thinkpad.toml

[general]
autostart = [
  "noctalia",
]

[input.keyboard]
layout = "br"
variant = "thinkpad"
model = "abnt2"
options = ""        # XKB options, comma-separated

[events]
lid_close = "umbriel msg output-disable:eDP-1"
lid_open = "umbriel msg output-enable:eDP-1"

[output.eDP-1]
min_workspaces = 4
