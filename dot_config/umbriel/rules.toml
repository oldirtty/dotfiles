# rules.toml

################################
######## GENERAL CONFIG ########
################################

#### Wayland surfaces ####
[[layer_rule]]
blur = false

#### Windows ####
[[window_rule]]
blur = true
blur_popups = true

################################
######### LAYER RULES ##########
################################

# Noctalia shell
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

################################
########## APP CONFIG ##########
################################

#### Noctalia Settings ####
[[window_rule]]
match.app_id = "dev.noctalia.Noctalia"
default_floating = true

# Terminal emulators
[[window_rule]]
match.app_id = "(ghostty$|^kitty$|^foot$)"
default_width = 0.25

# Always use VRR for game content, even when the output policy disables it
[[window_rule]]
match.content_type = "game"
vrr = "always"

# Steam notification toasts
[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# Force no transparency to games
[[window_rule]]
match.app_id = "^(steam_proton|steam_app.*|steam_app_[0-9]+)$"
opacity = 1.0

################################
####### FLOATING WINDOWS #######
################################

# Noctalia share picker
[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_size = [800, 600]
default_position = { x = 32, y = 32, anchor = "bottom_right" }

# Floating PIP
[[window_rule]]
match.app_id = "(firefox$|zen$)"
match.title = "^Picture-in-Picture$"
default_floating = true
default_maximize = true

# Floating web extension popups
[[window_rule]]
match.title = "^Extension.*Zen Browser$"
default_floating = true
default_size = [400, 600]
default_position = { x = 16, y = 16, anchor = "top_right" }

# Floating mpv audio files
[[window_rule]]
match.title = ".*\\.(wav|mp3|flac|aac|ogg|m4a|opus).* - mpv"
default_floating = true

# Float common dialogs by title
[[window_rule]]
match.title = "^(Open File|Select|Choose a wallpaper|Open Folder|Save As|Library|Choose Where to Download|File Operation Progress|Rename|Copy Files|Move Files|Search Files)"
default_floating = true

# Float utility windows
[[window_rule]]
match.app_id = "^(Emulator|zenity|xdg-desktop-portal.*|qalculate-gtk|org\\.pulseaudio\\.pavucontrol|pwvucontrol)$"
default_floating = true

# Floating apps
[[window_rule]]
match.app_id = "(^org\\.gnome\\.(Calculator|Loupe|font-viewer)$|^gnome-calculator$|^galculator$|^blueman-manager$|^xdg-desktop-portal$|^com.saivert.pwvucontrol$|^thunar$|^Thunar$)"
default_floating = true
