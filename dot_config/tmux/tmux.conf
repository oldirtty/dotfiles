#### Terminal capabilities & general behavior ####
# TERM value used inside panes.
set -g default-terminal "tmux-256color"
# Advertise 24-bit (RGB) color for outer terminals whose TERM matches these names.
set -ag terminal-overrides ",xterm-256color:RGB,xterm-kitty:RGB,foot*:RGB"
# Accept modified keys that legacy encodings cannot express (e.g. Ctrl+Shift+C),
# and forward them to applications that request them.
set -s extended-keys on
# Tell tmux that these outer terminals support extended keys and OSC 52 clipboard.
set -as terminal-features 'xterm*:extkeys:clipboard,foot*:extkeys:clipboard'
# Let applications in panes send escape sequences straight to the outer terminal.
set -g allow-passthrough on
# Sync clipboard with the outer terminal and pipe selections directly to wl-copy.
set -g set-clipboard on
set -s copy-command "wl-copy"
# Do not wait after Esc to disambiguate it from Alt/escape sequences.
set -sg escape-time 0

# Number windows and panes from 1, and renumber windows when one is closed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Do not paint pane backgrounds: the terminal's own background (and its
# transparency) shows through.
set -g window-style "bg=default"
set -g window-active-style "bg=default"

#### Mouse (standard terminal emulator behavior) ####
set -g mouse on

# Do not copy or exit selection mode when releasing the mouse button.
unbind -T copy-mode    MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

# Dragging enters selection mode (unless the running app captures the mouse).
# Inside copy-mode, dragging starts a new selection without resetting scroll position.
bind -n MouseDrag1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -M'
bind -T copy-mode    MouseDrag1Pane select-pane \; send -X begin-selection
bind -T copy-mode-vi MouseDrag1Pane select-pane \; send -X begin-selection

# Double/triple click selects a word/line and keeps it highlighted.
bind -n DoubleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -H ; send -X select-word'
bind -n TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -H ; send -X select-line'
bind -T copy-mode    DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode    TripleClick1Pane select-pane \; send -X select-line
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line

# Single click clears an active selection; if nothing is selected, exits copy-mode.
bind -T copy-mode    MouseDown1Pane select-pane \; if -F '#{selection_present}' 'send -X clear-selection' 'send -X cancel'
bind -T copy-mode-vi MouseDown1Pane select-pane \; if -F '#{selection_present}' 'send -X clear-selection' 'send -X cancel'

# Ctrl+Shift+C copies the active selection to the system clipboard and exits selection mode.
# Ensure the outer terminal does not intercept this keybind (e.g., foot: clipboard-copy=none).
bind -T copy-mode    C-S-c send -X copy-selection-and-cancel
bind -T copy-mode    C-S-C send -X copy-selection-and-cancel
bind -T copy-mode-vi C-S-c send -X copy-selection-and-cancel
bind -T copy-mode-vi C-S-C send -X copy-selection-and-cancel

#### Titles & keybindings ####
# Set the outer terminal's title to the pane title.
set -g set-titles on
set -g set-titles-string "#T"
# Enable automatic tab naming (evaluated in window-status formats below).
setw -g automatic-rename on

# Ctrl+Shift+Backspace deletes to the start of the line (sends Ctrl+U).
bind -n C-S-BSpace send-keys C-u
# F10 opens the pane's working directory in the default file manager.
bind -n F10 run-shell -b "cd #{pane_current_path} && xdg-open ."

# Alt+Shift+Arrow splits in that direction, keeping the working directory
# (-b places the new pane before: above/left).
bind -n M-S-Up    split-window -vb -c "#{pane_current_path}"
bind -n M-S-Down  split-window -v  -c "#{pane_current_path}"
bind -n M-S-Left  split-window -hb -c "#{pane_current_path}"
bind -n M-S-Right split-window -h  -c "#{pane_current_path}"

# Alt+r enters resize mode and refreshes the status bar to show RESIZE;
# arrows resize the pane by 2 cells; Esc or Enter returns to normal mode.
bind -n M-r switch-client -T resize \; refresh-client -S
bind -T resize Up     resize-pane -U 2 \; switch-client -T resize
bind -T resize Down   resize-pane -D 2 \; switch-client -T resize
bind -T resize Left   resize-pane -L 2 \; switch-client -T resize
bind -T resize Right  resize-pane -R 2 \; switch-client -T resize
bind -T resize Escape switch-client -T root \; refresh-client -S
bind -T resize Enter  switch-client -T root \; refresh-client -S

# Tab creation and direct switching (Alt+t and Alt+1..9).
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt+Arrow moves between panes; Alt+Left/Right at the pane edge switches windows.
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-Left  if-shell -F "#{pane_at_left}"  "previous-window" "select-pane -L"
bind -n M-Right if-shell -F "#{pane_at_right}" "next-window"     "select-pane -R"

#### Theme ####
# Accent colors: fallbacks (ANSI names), overridden by the generated theme file
# when it exists (-q: no error if it is missing).
set -g @accent "blue"
set -g @on_accent "black"
source-file -q ~/.config/tmux/themes/noctalia.conf
if-shell -F '#{!=:#{@noctalia_primary},}' 'set -gqF @accent "#{@noctalia_primary}"'
if-shell -F '#{!=:#{@noctalia_on_primary},}' 'set -gqF @on_accent "#{@noctalia_on_primary}"'

# Selection / highlight in copy-mode.
set -g mode-style "bg=brightwhite,fg=black"
# Status bar: transparent background, default foreground.
set -g status-style "bg=default,fg=default"
# Inactive window entries.
set -g window-status-style "fg=white"
# Active window entry, highlighted with the accent.
set -g window-status-current-style "bg=#{@accent},fg=#{@on_accent},bold"
# Pane borders; the active pane's border uses the accent.
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=#{@accent}"
# Messages and the command prompt line.
set -g message-style "fg=#{@accent}"
set -g message-command-style "fg=#{@accent}"
# Selection style on tmux versions that have this option (-q ignores it otherwise).
set -gq copy-mode-selection-style "bg=brightwhite,fg=black"

#### Status bar ####
set -g status-position bottom
set -g status-justify left
# Redraw (and re-run #() commands) every 5 seconds.
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 50

# Left side: show active mode badge only for non-default states (empty in normal mode).
# Possible states: RESIZE, SELECT (copy-mode), TREE, VIEW, CLOCK, PREFIX, or SYNC.
set -g status-left "#{?#{==:#{client_key_table},resize},#[bg=yellow]#[fg=black]#[bold] RESIZE #[default] ,#{?#{==:#{pane_mode},copy-mode},#[bg=brightwhite]#[fg=black]#[bold] SELECT #[default] ,#{?#{==:#{pane_mode},tree-mode},#[bg=magenta]#[fg=black]#[bold] TREE #[default] ,#{?#{==:#{pane_mode},view-mode},#[bg=cyan]#[fg=black]#[bold] VIEW #[default] ,#{?#{==:#{pane_mode},clock-mode},#[bg=blue]#[fg=black]#[bold] CLOCK #[default] ,#{?client_prefix,#[bg=red]#[fg=black]#[bold] PREFIX #[default] ,#{?pane_synchronized,#[bg=magenta]#[fg=black]#[bold] SYNC #[default] ,}}}}}}}"

# Right side: optional command duration, battery widget, and 24-hour clock.
set -g status-right "#{?@cmd_duration,#[fg=white]took #{@cmd_duration} #[default],}#(~/.config/tmux/sh/tmux-battery.sh)| %H:%M "

# Window list: show running app if not zsh, else git repo root basename, else "zsh".
setw -g window-status-separator " "
setw -g window-status-format " #I:#{?automatic-rename,#(~/.config/tmux/sh/tmux-tab-title.sh '#{pane_current_command}' '#{pane_current_path}'),#W} "
setw -g window-status-current-format " #I:#{?automatic-rename,#(~/.config/tmux/sh/tmux-tab-title.sh '#{pane_current_command}' '#{pane_current_path}'),#W} "
