#### General & Appearance (MUST BE AT THE TOP) ####
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-kitty:RGB,foot*:RGB"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys,foot*:extkeys'
set -g allow-passthrough on
set -sg escape-time 0

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mantém o fundo dos painéis transparente (respeita alpha 0.97 do Kitty e Foot)
set -g window-style "bg=default"
set -g window-active-style "bg=default"

#### Mouse & Keybinds ####
set -g mouse on
unbind -n MouseDrag1Pane
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

set -g set-titles on
set -g set-titles-string "#T"
setw -g automatic-rename on

bind -n C-S-BSpace send-keys C-u
bind -n F10 run-shell -b "cd #{pane_current_path} && xdg-open ."

# Splits
bind -n M-S-Up    split-window -vb -c "#{pane_current_path}"
bind -n M-S-Down  split-window -v  -c "#{pane_current_path}"
bind -n M-S-Left  split-window -hb -c "#{pane_current_path}"
bind -n M-S-Right split-window -h  -c "#{pane_current_path}"

# Resize (alt+r)
bind -n M-r switch-client -T resize
bind -T resize Up     resize-pane -U 2 \; switch-client -T resize
bind -T resize Down   resize-pane -D 2 \; switch-client -T resize
bind -T resize Left   resize-pane -L 2 \; switch-client -T resize
bind -T resize Right  resize-pane -R 2 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter  switch-client -T root

# Tabs (alt+t e alt+1..9)
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Navegação unificada entre splits e abas
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-Left  if-shell -F "#{pane_at_left}"  "previous-window" "select-pane -L"
bind -n M-Right if-shell -F "#{pane_at_right}" "next-window"     "select-pane -R"

#### Noctalia Theme Integration ####
set -g @noctalia_inactive_tabs_use_background "off"
if-shell '[ -f ~/.config/tmux/noctalia.conf ]' 'source-file ~/.config/tmux/noctalia.conf'

#### Status Bar Layout & Transparency Overrides ####
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50

set -g status-left ""
set -g status-right "#{?@cmd_duration,#[fg=#{?@noctalia_outline,#{@noctalia_outline},brightblack}]took #{@cmd_duration} ,}"

setw -g window-status-separator " "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# Sobrescreve apenas o fundo da barra para transparente e destaca a aba ativa com @noctalia_primary
set -gqF status-style "bg=default,fg=#{?@noctalia_on_surface,#{@noctalia_on_surface},default}"
set -gqF window-status-current-style "bg=#{?@noctalia_primary,#{@noctalia_primary},white},fg=#{?@noctalia_on_primary,#{@noctalia_on_primary},black},bold"

set -g status-bg default
set -g status-style bg=default
set -g window-status-style bg=default
set -g window-status-current-style bg=default
