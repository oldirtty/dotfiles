# Disable keybindings
1 ignore
2 ignore
3 ignore
4 ignore
5 ignore
6 ignore
7 ignore
8 ignore
9 ignore
j ignore
s ignore
r ignore
q ignore
Q ignore
Shift+z ignore
Shift+Z ignore
Ctrl+Shift+LEFT ignore
Ctrl+Shift+RIGHT ignore

# Playback control
h script-message osc-visibility cycle
SPACE cycle pause
ENTER cycle fullscreen
ESC set fullscreen no
m cycle mute ; show-text "${?mute==yes:🔇 Muted}${?mute==no:🔊 Unmuted}"
i cycle-values interpolation yes no ; show-text "Interpolation: ${interpolation}"
t show-text "${time-pos} / ${duration}"
Shift+t show-text "${time-pos} / -${time-remaining}"

# Standard arrow keys to seek
LEFT seek -5
RIGHT seek 5
UP add volume 5
DOWN add volume -5

# Ctrl+/- to change video speed
Ctrl+RIGHT seek 60
Ctrl+LEFT seek -60
Shift+RIGHT seek 3
Shift+LEFT seek -3
Ctrl+q quit
Ctrl+z set sub-delay 0
Ctrl+n cycle-values audio-normalize yes no; show-text "Audio Normalization: ${audio-normalize}"

# Toggle fullscreen with 'f'
f cycle fullscreen
F cycle fullscreen

# Mouse bindings - set left click as main button (play/pause)
# MBTN_LEFT cycle pause

# Playlist manipulation
n playlist-next
p playlist-prev

# Subtitle and audio cycling
s cycle sub
a cycle audio
Shift+s cycle sub down
Shift+a cycle audio down
Shift+UP add sub-pos -1
Shift+DOWN add sub-pos +1
= add sub-scale +0.1
- add sub-scale -0.1
0 set sub-scale 1

# Screenshot
Ctrl+s screenshot video
Ctrl+S screenshot window
Alt+s no-osd cycle sub; no-osd screenshot video; no-osd cycle sub

# Profiles (apply / Shift+ to restore previous values)
F1 apply-profile default; show-text "Profile: Default" 2000
F2 apply-profile anime; show-text "Profile: Anime4K" 2000
Shift+F2 apply-profile anime restore; show-text "Profile: Anime4K (restored)" 2000
F3 apply-profile remux-4k-hdr; show-text "Profile: REMUX 4K/HDR" 2000
Shift+F3 apply-profile remux-4k-hdr restore; show-text "Profile: REMUX 4K/HDR (restored)" 2000
F4 apply-profile safe-mode; show-text "Profile: Safe Mode" 2000
Shift+F4 apply-profile safe-mode restore; show-text "Profile: Safe Mode (restored)" 2000

# Anime 4K
CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"
