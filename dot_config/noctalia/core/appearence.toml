#####################################
############# GENERAL ###############
#####################################

[control_center]
sidebar = "full"
sidebar_section = "none"

[notification]
border_width = 1.0

[osd]
border_width = 1.0

[shell]
button_borders = false
card_borders = false
input_borders = true
popup_borders = true
popup_shadows = false
show_close_buttons = false

[shell.panel]
border_width = 1.0
shadow = false
floating_offset = 12
transparency_mode = "solid"

#####################################
############### DOCK ################
#####################################
[dock]
enabled = true
reserve_space = false
shadow = true
position = "bottom"
border_width = 1.0
radius = 12
margin_edge = 12
item_spacing = 0
show_dots = true
inactive_opacity = 1
active_scale = 1
inactive_scale = 1
main_axis_padding = 4
cross_axis_padding = 4

#####################################
################ BAR ################
#####################################
[bar.default]
auto_hide_reserve_space = true
show_on_workspace_switch = false
shadow = false
margin_ends = 0
panel_overlap = 0
padding = 0
radius = 0
radius_top_left = 0
radius_top_right = 0
widget_spacing = 10
capsule_radius = 2
capsule_thickness = 0.75
start = [
  "Space",
  "group:workspace",
]
center = [
  "clock",
]
end = [
  "media",
  "tray",
  "notifications",
  "network",
  "privacy",
  "volume",
  "battery",
  "Separator",
  "Distro",
  "Padding",
]
[[bar.default.capsule_group]]
accordion = true
accordion_direction = "start"
border_width = 1.0
enabled = true
id = "workspace"
members = [ "dynamic_workspaces", "umbriel_companion", "Separator" ]
radius = 2.0
opacity = 0.0
[bar.default.dead_zone.actions]
right = "none"
scroll_down = "exec umbriel msg workspace-next"
scroll_up = "exec umbriel msg workspace-previous"

[widget.battery]
show_label = true
peek = true
[widget.battery.actions]
left = "panel-toggle oldirtty/core:panel"
right = "brightness-set 0.02"
scroll_down = "brightness-down"
scroll_up = "brightness-up"

[widget.bluetooth]
show_label = true
peek = true

[widget.clock]
format = "{:%~a %R}"
tooltip_format = "{:%~A, %X%n%-e de %~B}"

[widget.Distro]
type = "custom_button"
custom_image_colorize = true
[widget.Distro.actions]
left = "panel-toggle control-center"
right = "settings-open"

[widget.media]
hide_when_no_media = true
min_length = 0
scroll_repeat = "steps"
[widget.media.actions]
scroll_down = "media volume-down 5"
scroll_up = "media volume-up 5"

[widget.network]
show_label = true
peek = true

[widget.privacy]
active_color = "on_primary"
capsule = true
capsule_fill = "primary"
hide_inactive = true

[widget.tray]
drawer = true
capsule_padding = 4
detached_panel = true
match_adjacent_spacing = true

[widget.volume]
show_label = true
peek = true

[widget.workspaces]
empty_color = "outline_variant"
occupied_color = "on_surface_variant"
show_labels = false
[widget.workspaces.actions]
right = "exec umbriel msg overview-toggle"

# Separators
[widget.Separator]
type = "text"
text = "𝇁"
color = "outline_variant"
interactive = false

[widget.Divider]
type = "text"
text = "|"
interactive = false
color = "#00000000"
capsule = true
capsule_fill = "outline_variant"
capsule_padding = 0
font_scale = 0.3

[widget.Padding]
length = 16
type = "spacer"

[widget."No Space"]
length = 0
type = "spacer"

[widget.Space]
length = 4
type = "spacer"

# Oficial plugins
[widget.umbriel_companion]
type = "noctalia/umbriel-companion:bar"
scroll_cycles_layout = false

# Community Plugins
[widget.phone_connect]
type = "icefish/phone-connect:bar"

[widget.processes]
type = "tordex/processes:widget"

# Personal plugins
# [widget.color_picker]
# type = "oldirtty/color_picker:widget"

[widget.core]
type = "oldirtty/core:widget"

[widget.dynamic_workspaces]
type = "oldirtty/dynamic-workspaces:workspaces"
# custom_labels = ["Ø", "1", "2", "3", "4", "5", "6", "7", "8", "9"]
# custom_labels = [ "Ø", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX" ]
# custom_labels = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"]
pill_size_mode = "Fixed_Length"
active_length = 2.5
block_height = 0.40
gap = 4
empty_background = "outline_variant"
occupied_background = "on_surface_variant"
show_label = false
