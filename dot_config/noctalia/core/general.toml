[audio]
enable_overdrive = true
enable_sounds = true

[battery]
warning_threshold = 20

[brightness]
enable_ddcutil = true
minimum_brightness = 0.02
sync_all_monitors = true

[control_center]
show_session_button = false

[nightlight]
enabled = true
temperature_night = 2200

[osd]
follow_focused_output = true

[shell]
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true

[shell.launcher]
provider_prefix = " "
search_position = "top"
show_session_button = false
show_settings_button = false
category_icons_only = true
width = 640

[shell.launcher.providers.panels]
prefix = "p"

[shell.launcher.providers.session]
global = true
prefix = "s"

[shell.launcher.providers.windows]
prefix = "w"

[shell.panel]
control_center_placement = "floating"
open_near_click_control_center = true
wallpaper_placement = "floating"
wallpaper_position = "center"
# Session Panel
session_placement = "floating"
session_position = "center"
open_near_click_session = true

[shell.screenshot]
region_border_width = 1.0
region_modifier = "super"
show_region_hint = false
confirm_region = true
directory = "~/Pictures/Screenshots/"
filename_pattern = "screenshot_%Y%m%d_%H%M%S"
remember_last_region = true
save_to_file = false

[shell.session]
grid = true
grid_columns = 3

[[shell.session.actions]]
action = "lock"
countdown_seconds = 10.0
enabled = true
shortcut = "l"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 10.0
enabled = true
shortcut = "x"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 10.0
enabled = true
shortcut = "s"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 10.0
enabled = true
shortcut = "r"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 10.0
enabled = true
shortcut = "p"
variant = "destructive"

[shell.window_switcher]
mru = true

[theme]
[theme.templates]
builtin_ids = ["gtk3", "gtk4", "helix", "kcolorscheme"]

[wallpaper]
directory = "~/Pictures/wallpaper"
transition = ["pixel"]
transition_on_startup = true
