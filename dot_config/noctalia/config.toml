[include]
files = ["templates.toml"]

[audio]
enable_overdrive = true
enable_sounds = true

[backdrop]
enabled = false

[bar.default]
capsule_radius = 4
capsule_thickness = 0.8
center = []
end = [
    "corner_left",
    "group:tools",
    "notifications",
    "sep",
    "privacy",
    "group:volume",
    "brightness",
    "battery",
    "sep",
    "bluetooth",
    "network",
    "battery",
    "sep",
    "tray",
    "clock",
    "overview",
    "corner_right"
]
margin_ends = 0
padding = 12
radius = 8
shadow = false
start = [ "corner_left", "control-center", "sep", "workspaces", "media", "corner_right" ]
thickness = 32
widget_spacing = 10

    [bar.default.dead_zone.actions]
    middle = "settings-open bar"

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "start"
    enabled = true
    fill = "surface_variant"
    id = "volume"
    members = [ "volume", "input_volume" ]
    opacity = 0.0
    padding = 0.0
    radius = 4.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "start"
    enabled = true
    fill = "surface_variant"
    id = "tools"
    members = [ "clipboard", "widget" ]
    opacity = 0.0
    padding = 0.0
    radius = 4.0

[battery]
warning_threshold = 20

[brightness]
minimum_brightness = 0.02

[desktop_widgets]
enabled = false

[dock]
background_opacity = 1
border_width = 1.0
enabled = true
icon_size = 42
inactive_opacity = 1
inactive_scale = 1.0
launcher_position = "end"
magnification_scale = 1.25
main_axis_padding = 8
margin_edge = 8
radius = 8
reserve_space = false
shadow = false
show_dots = true
smart_auto_hide = true

[notification]
background_opacity = 1
history_retention_hours = 6
layer = "top"
position = "top_right"

[osd]
background_opacity = 1
orientation = "vertical"
position = "top_right"
position_vertical = "center_right"

[shell]
corner_radius_scale = 0.75
niri_overview_type_to_launch_enabled = true
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true

    [shell.launcher]
    categories = false

        [shell.launcher.providers.windows]
        global = true

    [shell.panel]
    control_center_placement = "floating"
    list_item_background = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "solid"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    enabled = true
    size = 16

    [shell.screenshot]
    confirm_region = true
    directory = "~/Pictures/Screenshots/"
    filename_pattern = "screenshot_%Y%m%d_%H%M%S"
    remember_last_region = true
    save_to_file = false

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "l"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "x"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "s"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "r"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "p"
        variant = "destructive"

[theme]

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "helix", "qt" ]

[widget.clock]
color = "primary"
format = "{:%a %0e, %H:%M}"
tooltip_format = "%e de %B%n  %X"

[widget.control-center]
custom_image_colorize = true

    [widget.control-center.actions]
    left = "panel-open launcher"
    right = "panel-open control-center home"

[widget.corner_left]
color = "outline"
interactive = false
text = """╭
"""
type = "text"

[widget.corner_right]
color = "outline"
interactive = false
text = """⠀
╯"""
type = "text"

[widget.input_volume]
show_label = false

[widget.media]
anchor = true
title_scroll = "on_hover"

    [widget.media.actions]
    middle = "exec ~/.bin/focus_app.sh spotify"
    scroll_down = "exec playerctl -p spotify volume 0.05-"
    scroll_up = "exec playerctl -p spotify volume 0.05+"

[widget.overview]
color = "on_surface"
custom_image_colorize = true
glyph = "noctalia"
type = "custom_button"

    [widget.overview.actions]
    left = "exec niri msg action toggle-overview"
    right = "panel-open control-center"

[widget.privacy]
active_color = "on_primary"
capsule = true
capsule_fill = "primary"
hide_inactive = true

[widget.sep]
color = "outline"
interactive = false
text = "𝇁"
type = "text"

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.widget]
type = "oldirtty/color_picker:widget"

[widget.workspaces]
active_pill_size = 1.25
empty_color = "surface"
occupied_color = "surface"
scale = 1.25
scroll_repeat = "steps"
