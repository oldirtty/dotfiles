[include]
files = ["templates.toml"]

[audio]
enable_overdrive = true
enable_sounds = true

[backdrop]
enabled = false

[bar.default]
background_opacity = 1.0
thickness = 32
margin_ends = 0
padding = 12
radius = 0
shadow = false
capsule_radius = 4
widget_spacing = 8
start = [ "corner_left", "workspaces", "sep", "umbriel_companion", "corner_right" ]
center = ["corner_left", "media", "corner_right"]
end = [
    "corner_left",
    "tray",
    "phone_connect",
    "bluetooth",
    "network",
    "sep",
    "privacy",
    "group:volume",
    "brightness",
    "battery",
    "sep",
    "clock",
    "corner_right"
]

    [bar.default.dead_zone.actions]
    middle = "settings-open bar"

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "start"
    enabled = true
    fill = "surface_variant"
    id = "volume"
    members = [ "volume", "input_volume" ]
    opacity = 0.0
    padding = 0.0

[battery]
warning_threshold = 20

[brightness]
enable_ddcutil = true
minimum_brightness = 0.02

[control_center]
sidebar_section = "none"

[desktop_widgets]
enabled = false

[dock]
enabled = true
reserve_space = false
shadow = false
show_dots = true
smart_auto_hide = true
background_opacity = 0.97
radius = 6
border_width = 2.0
item_spacing = 0
main_axis_padding = 8
cross_axis_padding = 2
margin_edge = 8
magnification_scale = 1.25
inactive_opacity = 1
inactive_scale = 1.0
launcher_position = "end"

[nightlight]
enabled = true
temperature_night = 2200

[notification]
background_opacity = 0.97
history_retention_hours = 6
layer = "top"
position = "top_right"

[osd]
background_opacity = 0.97
orientation = "vertical"
position = "top_right"
position_vertical = "center_right"

[plugins]
enabled = [
    "cleboost/zed-provider",
    "noctalia/umbriel-companion",
    "noctalia/screen_recorder",
    "oldirtty/color_picker",
    "icefish/phone-connect",
    "thaer99ob/default-apps"
]

[shell]
corner_radius_scale = 0.5
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true

    [shell.launcher]
    categories = false

        [shell.launcher.providers.windows]
        global = true

    [shell.panel]
    control_center_placement = "floating"
    list_item_background = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "solid"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    enabled = false
    size = 16

    [shell.screenshot]
    confirm_region = true
    directory = "~/Pictures/Screenshots/"
    filename_pattern = "screenshot_%Y%m%d_%H%M%S"
    remember_last_region = true
    save_to_file = false

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "l"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "x"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "s"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "r"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "p"
        variant = "destructive"

    [shell.window_switcher]
    mru = true

[theme]
    [theme.templates]
    builtin_ids = [ "foot", "gtk3", "gtk4", "helix" ]
    community_ids = [ "whitesur-icons" ]

[widget.clock]
color = "primary"
format = "{:%a %0e, %H:%M}"
tooltip_format = "%e de %B%n  %X"

[widget.corner_left]
color = "primary"
interactive = false
text = """╭
"""
type = "text"

[widget.corner_right]
color = "primary"
interactive = false
text = """⠀
╯"""
type = "text"

[widget.input_volume]
show_label = false

[widget.media]
anchor = true
hide_when_no_media = true
max_length = 300
title_scroll = "on_hover"

    [widget.media.actions]
    scroll_down = "exec playerctl -p spotifast volume 0.05-"
    scroll_up = "exec playerctl -p spotifast volume 0.05+"


[widget.phone_connect]
type = "icefish/phone-connect:bar"

[widget.privacy]
active_color = "on_primary"
capsule = true
capsule_fill = "primary"
hide_inactive = true

[widget.sep]
color = "primary"
interactive = false
text = "𝇁"
type = "text"

[widget.tray]
drawer = true

[widget.widget]
type = "oldirtty/color_picker:widget"

[widget.workspaces]
active_pill_size = 1.25
max_label_chars = 4
show_labels = false
empty_color = "outline"
occupied_color = "outline"
scroll_repeat = "steps"

[widget.umbriel_companion]
type = "noctalia/umbriel-companion:bar"
enable_scroll = false
show_layout_name = true
