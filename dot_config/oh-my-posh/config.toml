version = 3
final_space = true

[[blocks]]
type = "prompt"
alignment = "left"

  [[blocks.segments]]
  type = "session"
  style = "plain"
  foreground = "green"
  foreground_templates = ["{{ if .Root }}red{{ end }}"]
  template = "{{ if or .Root .Env.SSH_CONNECTION }}<b>{{ .UserName }}</b>{{ end }}"

  [[blocks.segments]]
  type = "text"
  style = "plain"
  foreground = "white"
  template = "{{ if or .Root .Env.SSH_CONNECTION }}<b>@</b>{{ end }}"

  [[blocks.segments]]
  type = "session"
  style = "plain"
  foreground = "cyan"
  template = "{{ if or .Root .Env.SSH_CONNECTION }}<b>{{ .HostName }}</b>{{ end }}"

  [[blocks.segments]]
  type = "text"
  style = "plain"
  foreground = "white"
  template = "{{ if or .Root .Env.SSH_CONNECTION }}:{{ end }}"

  [[blocks.segments]]
  type = "git"
  style = "plain"
  foreground = "blue"
  template = "<b>{{ .RepoName }}{{ if .RelativeDir }}/{{ .RelativeDir }}{{ end }}</b>"

  [[blocks.segments]]
  type = "path"
  style = "plain"
  foreground = "blue"
  template = "{{ if not .Segments.Git.RepoName }}<b>{{ .Path }}</b>{{ end }}"

    [blocks.segments.properties]
    style = "full"

  [[blocks.segments]]
  type = "git"
  style = "plain"
  foreground = "magenta"
  template = "<b> ({{ .HEAD }}{{ if or .Working.Changed .Staging.Changed .Ahead .Behind (gt .StashCount 0) }} {{ end }}{{ if .Working.Unmerged }}={{ end }}{{ if gt .Ahead 0 }}⇡{{ end }}{{ if gt .Behind 0 }}⇣{{ end }}{{ if .Staging.Changed }}+{{ end }}{{ if .Working.Modified }}!{{ end }}{{ if .Working.Deleted }}✘{{ end }}{{ if .Working.Untracked }}?{{ end }}{{ if gt .StashCount 0 }}${{ end }})</b>"

    [blocks.segments.properties]
    fetch_status = true
    fetch_stash_count = true
    fetch_upstream_icon = false

[[blocks]]
type = "prompt"
alignment = "left"
newline = true

  [[blocks.segments]]
  type = "text"
  style = "plain"
  foreground = "green"
  foreground_templates = ["{{ if gt .Code 0 }}red{{ end }}"]
  template = "<b>❯</b>"
