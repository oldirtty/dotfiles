[main]
include=~/.config/foot/themes/Noctalia

font=BlexMono Nerd Font:style=Medium:size=10.5
font-bold=BlexMono Nerd Font:style=Bold:size=10.5
font-italic=BlexMono Nerd Font:style=Italic:size=10.5
font-bold-italic=BlexMono Nerd Font:style=Bold Italic:size=10.5
pad=12x12
term=xterm-256color

[bell]
urgent=no

[cursor]
style=beam
beam-thickness=1.5

[mouse]
hide-when-typing=no

[colors-dark]
alpha=0.97

[key-bindings]
show-urls-launch=none
fullscreen=F11
font-increase=Control+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+t
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

[text-bindings]
\x15=Control+Shift+BackSpace
