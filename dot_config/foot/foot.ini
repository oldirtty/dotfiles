[main]
include=~/.config/foot/themes/noctalia.ini
font=0xProto Nerd Font:size=10.5
pad=4x4
shell=tmux new-session -A -s tmux

[bell]
urgent=no

[cursor]
style=beam
beam-thickness=1.5

[mouse]
hide-when-typing=no

[colors-dark]
alpha=0.97

[key-bindings]
show-urls-launch=none
fullscreen=F11
font-increase=Control+equal
font-decrease=Control+minus
font-reset=Control+0
clipboard-paste=Control+Shift+v
clipboard-copy=none

[text-bindings]
\x15=Control+Shift+BackSpace
