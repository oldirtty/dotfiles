#### Theme configuration ####
include themes/Noctalia.conf

#### Font configuration ####
font_family      family="0xProto Nerd Font" style="Regular"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5
text_composition_strategy legacy
text_fg_override_threshold 1.5 ratio
linux_display_server wayland

#### Terminal features ####
mouse_hide_wait -1.0
confirm_os_window_close 0
enabled_layouts splits

#### Shell Integration ####
shell_integration no-cursor no-title
tab_title_template "{title}"

#### Window Configuration ####
hide_window_decorations no
background_opacity 0.97
window_padding_width 4

#### Cursor configuration ####
cursor_shape beam
cursor_beam_thickness 1.5

#### Keybinds ####
map ctrl+comma edit_config_file
map ctrl+shift+backspace send_text all \x15
map ctrl+shift+y copy_last_command_output

map ctrl+equal change_font_size all +1.5
map ctrl+minus change_font_size all -1.5
map ctrl+0 change_font_size all 0

map f11 toggle_fullscreen
map ctrl+shift+q no_op

map ctrl+shift+t
