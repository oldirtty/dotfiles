# ── Theme configuration ────────
include themes/Noctalia.conf

# ── Font configuration ────────
font_family      GohuFont 11 Nerd Font
font_size        12
text_composition_strategy 1.25 50
box_drawing_scale 0.001, 1, 1.5, 2

# ── Terminal features ────────
mouse_hide_wait -1.0
confirm_os_window_close 0
inactive_text_alpha -0.5
enabled_layouts splits

# ── Shell Integration ────────
shell_integration no-cursor

# ── Window configuration ────────
hide_window_decorations yes
background_opacity 0.8
window_padding_width 12

# ── Cursor configuration ────────
cursor_shape beam
cursor_beam_thickness 1.5

# ── Keybinds ────────
map ctrl+comma edit_config_file
map ctrl+shift+r load_config_file
map ctrl+shift+backspace send_text all \x15
map ctrl+shift+y copy_last_command_output

map f11 toggle_fullscreen
map f10 send_text all xdg-open . &\r

map ctrl+shift+q no_op

# ── Splits Creation ────────
map alt+s launch --location=split --cwd=current

# Directional Splits
map alt+shift+up    launch --location=hsplit --cwd=current
map alt+shift+down  launch --location=hsplit --cwd=current
map alt+shift+left  launch --location=vsplit --cwd=current
map alt+shift+right launch --location=vsplit --cwd=current

# ── Split Navigation ────────
map alt+up    neighboring_window up
map alt+down  neighboring_window down
map alt+left  neighboring_window left
map alt+right neighboring_window right
