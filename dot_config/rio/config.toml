# ~/.config/rio/config.toml

confirm-before-quit = false
hide-mouse-when-typing = false
padding = [4]
line-height = 0.85
term=xterm-256color

[window]
opacity = 0.97
decorations = "Disabled"

[panel]
padding = [4]
border-width = 3.0
row-gap = 0
column-gap = 0

[fonts]
size = 14
family = "0xProto Nerd Font"

[cursor]
shape = 'beam'
blinking = false

[navigation]
mode = "Tab"
use-current-path = true
clickable = true
unfocused-split-opacity = 0.6
hide-if-single = true
current-working-directory = true

[bell]
visual = false
audio = false

[renderer]
backend = "Webgpu"

[bindings]
keys = [
  { key = "p", with = "control | shift", action = "OpenCommandPalette" },
  { key = "t", with = "control | shift", action = "CreateTab" },
  { key = "c", with = "control | shift", action = "Copy" },
  { key = "v", with = "control | shift", action = "Paste" },
  { key = ",", with = "control", action = "OpenConfigEditor" },
  { key = "f11", with = "none", action = "ToggleFullscreen" },

  { key = "backspace", with = "control | shift", text = "\u0015" },

  { key = "=", with = "control", action = "IncreaseFontSize" },
  { key = "-", with = "control", action = "DecreaseFontSize" },
  { key = "0", with = "control", action = "ResetFontSize" },

  { key = "s", with = "alt", action = "SplitRight" },
  { key = "right", with = "alt | shift", action = "SplitRight" },
  { key = "left", with = "alt | shift", action = "SplitRight" },
  { key = "down", with = "alt | shift", action = "SplitDown" },
  { key = "up", with = "alt | shift", action = "SplitDown" },

  { key = "left", with = "alt", action = "SelectPrevSplitOrTab" },
  { key = "right", with = "alt", action = "SelectNextSplitOrTab" },

  { key = "up", with = "alt | control", action = "MoveDividerUp" },
  { key = "down", with = "alt | control", action = "MoveDividerDown" },
  { key = "left", with = "alt | control", action = "MoveDividerLeft" },
  { key = "right", with = "alt | control", action = "MoveDividerRight" },

  { key = "q", with = "control | shift", action = "None" },
]
