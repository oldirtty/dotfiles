[include]
files = ["templates.toml"]

[audio]
enable_overdrive = true
enable_sounds = true
sound_volume = 1

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.8
capsule = true
capsule_fill = "outline"
capsule_opacity = 0.5
capsule_thickness = 0.75
center = [ "clock" ]
concave_edge_corners = true
end = [
    "tray",
    "color-selector",
    "recorder",
    "privacy",
    "clipboard",
    "notifications",
    "group:g1",
    "group:g2",
    "control-center"
]
font_family = "Adwaita Sans"
margin_edge = 8
margin_ends = 8
margin_opposite_edge = 1
padding = 4
start = [ "workspaces", "media" ]
thickness = 36

    [[bar.default.capsule_group]]
    enabled = true
    fill = "outline"
    id = "g1"
    members = [ "bluetooth", "network" ]
    opacity = 0.5
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "outline"
    id = "g2"
    members = [ "volume", "brightness", "battery" ]
    opacity = 0.5
    padding = 6.0

[battery]
warning_threshold = 20

[control_center]

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

[desktop_widgets]
enabled = false

[dock]
auto_hide = true
concave_edge_corners = false
cross_axis_padding = 0
enabled = true
inactive_opacity = 1
inactive_scale = 1.0
launcher_position = "end"
main_axis_padding = 0
margin_edge = 4
radius = 12
reserve_space = false
show_dots = true

[nightlight]
temperature_night = 2000

[notification]
layer = "top"
position = "top_right"

[osd]
orientation = "vertical"
position_vertical = "center_right"
background_opacity = 0.8


    [osd.kinds]
    media = false

[shell]
password_style = "random"
screen_time_enabled = true
settings_show_advanced = true

    [shell.animation]
    speed = 1.5

    [shell.panel]
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "x"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "p"
    variant = "destructive"

[theme.templates]
builtin_ids = [ "gtk3", "gtk4", "qt" ]

[widget.battery]
display_mode = "graphic"
enabled = true
show_label = true

[widget.clock]
format = " %a %e %R "

[widget.control-center]
capsule = true
custom_image_colorize = true

[widget.media]
hide_when_no_media = false
title_scroll = "on_hover"

[widget.network]
show_label = true

[widget.privacy]
hide_inactive = true

[widget.session]
color = "error"

[widget.tray]
drawer = true

[widget.workspaces]
display = "none"
empty_color = "on_surface_variant"
